name: Alpha Deploy

on: 
  push:
    tags:
      - v*-alpha

env:
  PROJECT_ID: ${{ secrets.GCE_PROJECT }}

jobs:
  deploy:
    name: Trigger Version PR and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
      GCE_INSTANCE_ZONE: us-east4-c

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Extract tag version
        id: extract_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"      # v0.5.5-alpha
          VERSION="${TAG#v}"                  # 0.5.5-alpha
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Trigger version bump PR workflow
        run: |
          gh workflow run "Create Version PR" \
            --ref develop \
            -f version="${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCE_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: "506.0.0"

      - run: gcloud --quiet auth configure-docker

      - name: Build Docker image
        run: |
          echo '${{ secrets.RELEASES_SECRETS }}' >> config/releases.exs
          docker build --tag "gcr.io/duncan-openc2-plugfest/twinklyhaha:${GITHUB_REF_NAME}" .

      - name: Push Docker image
        run: docker push "gcr.io/duncan-openc2-plugfest/twinklyhaha:${GITHUB_REF_NAME}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: twinklyhaha-alpha
          region: us-east4
          image: "gcr.io/duncan-openc2-plugfest/twinklyhaha:${{ github.ref_name }}"

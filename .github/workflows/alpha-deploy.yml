name: Alpha Deploy

on: 
  push:
    tags:
      - v*-alpha

env:
  PROJECT_ID: ${{ secrets.GCE_PROJECT }}

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment:
      name: alpha
    permissions:
      contents: "write"
      id-token: "write"
      
    env:
      GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
      GCE_INSTANCE_ZONE: us-east4-c

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to push back

      - name: Extract tag version and update mix.exs
        id: update_mix
        run: |
          TAG="${GITHUB_REF#refs/tags/}"       # e.g., v1.2.3-alpha
          VERSION="${TAG#v}"                   # e.g., 1.2.3-alpha
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Update mix.exs version
          sed -i.bak -E "s/(version:\s*\")[^\"]+\"/\1${VERSION}\"/" mix.exs
          rm mix.exs.bak

      - name: Commit updated mix.exs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mix.exs
          git commit -m "chore: bump version to $VERSION from tag"
          git push origin HEAD:${{ github.ref_name }}

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCE_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: "506.0.0"

      - run: gcloud --quiet auth configure-docker

      - name: Build Docker image
        run: |
          echo '${{ secrets.RELEASES_SECRETS }}' >> config/releases.exs
          docker build --tag "gcr.io/duncan-openc2-plugfest/twinklyhaha:${GITHUB_REF_NAME}" .

      - name: Push Docker image
        run: docker push "gcr.io/duncan-openc2-plugfest/twinklyhaha:${GITHUB_REF_NAME}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: twinklyhaha-alpha
          region: us-east4
          image: "gcr.io/duncan-openc2-plugfest/twinklyhaha:${{ github.ref_name }}"
